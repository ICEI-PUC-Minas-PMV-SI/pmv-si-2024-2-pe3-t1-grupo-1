<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/atividades_fisicas.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
  <link href="../styles/cadastro.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/GerenciarConta.css">
  <script type="text/javascript" src="../js/login.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="shortcut icon" href="../imgs/index/Vector.png" type="image/x-icon">
    <link rel="shortcut icon" href="../imgs/index/Vector.png" type="image/x-icon">
    <title>Editar Informações</title>
</head>

<body>
    <div class="header">
        <h1>Editar Informações</h1>
        <div class="user-info">
            <div class="avatar-section">
                <img src="../imgs/iconesTemplatePadrao/icon_avatar.png" alt="Avatar do usuário" class="avatar">
                <p class="user-name" id="userName">Usuário XXX</p>
            </div>
            <div class="actions">
                <a class="edit-info" href="../pages/GerenciarConta.html">
                    <img src="../imgs/iconesTemplatePadrao/icon_editar.svg" alt="Ícone editar"> Editar informações
                </a>
                <a class="logout" href="../index.html">
                    <img src="../imgs/iconesTemplatePadrao/icon_sair.svg" alt="Ícone sair"> Sair
                </a>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
            <img src="../imgs/iconesTemplatePadrao/logo projeto.svg">
            <a href="..\pages\PaginaInicialLogado.html">
                <img src="../imgs/iconesTemplatePadrao/icon_paginainicial.svg">
            </a>
            <a href="..\pages\comunidades.html">
                <img src="../imgs/iconesTemplatePadrao/icon_comunidades.svg">
            </a>
            <a href="..\pages\ConteudosEducacionais.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_conteudoseducacionais.svg">
            </a>
            <a href="..\pages\alimentacao.html">
                <img src="../imgs/iconesTemplatePadrao/icon_alimentacao.svg">
            </a>
            <a href="..\pages\atividades_fisicas.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_atividadesfisicas.svg">
            </a>
            <a href="../pages/sono.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_sono.svg">
            </a>
            <a href="../pages/humor.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_humor.svg">
            </a>
            <a href="..\pages/metas.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_metas.svg">
            </a>
            <a href="..\pages\Ajuda.html">
                <img src="..\imgs\iconesTemplatePadrao/icon_ajuda.svg">
            </a>
        </div>
        <div class="container_principal">
            <p class="slogan-title">Edite as informações da sua conta</p>
            <div class="gerenciarContaFormContainer">
                <form>
                    <div id="formularioNome" class="input-group mb-3">
                      <span class="input-group-text" id="nome-icon"><i class="bi bi-person-fill"></i></span>
                      <div class="form-floating">
                        <input type="text" id="userNameInput" name="nome" class="form-control" placeholder="Nome Completo"
                          aria-label="Nome Completo" aria-describedby="nome-icon"/>
                        <label for="nome">Nome Completo</label>
                      </div>
                    </div>
                    <div id="formularioIdade" class="input-group mb-3">
                      <span class="input-group-text" id="idade-icon"><i class="bi bi-people-fill"></i></span>
                      <div class="form-floating">
                        <input type="number" id="userAgeInput" name="idade" class="form-control" placeholder="Idade" aria-label="Idade"
                          aria-describedby="idade-icon" min="0" max="120" />
                        <label for="idade">Idade</label>
                      </div>
                    </div>
                    <div id="formularioTelefone" class="input-group mb-3">
                      <span class="input-group-text" id="telefone-icon"><i class="bi bi-telephone-fill"></i></span>
                      <div class="form-floating">
                        <input type="tel" id="userPhoneInput" name="telefone" class="form-control" placeholder="(00) 00000-0000"
                          aria-label="Telefone" aria-describedby="telefone-icon" pattern="\(\d{2}\) \d{5}-\d{4}" />
                        <label for="telefone">Telefone</label>
                      </div>
                    </div>
                    <div id="formularioEmail" class="input-group mb-3">
                      <span class="input-group-text" id="email-icon"><i class="bi bi-envelope-fill"></i></span>
                      <div class="form-floating">
                        <input type="email" id="userEmailInput" name="email" class="form-control" placeholder="name@example.com"
                          aria-label="E-mail" aria-describedby="email-icon" />
                        <label for="email">Email</label>
                      </div>
                    </div>
                    <div id="formularioSenha" class="input-group mb-3">
                      <span class="input-group-text" id="password-icon">
                        <i class="bi bi-lock-fill"></i>
                      </span>
                      <div class="form-floating flex-grow-1">
                        <input type="password" id="userPasswordInput" name="password" class="form-control" placeholder="Password"
                          aria-label="Senha" aria-describedby="password-icon" />
                        <label for="password">Senha</label>
                      </div>
                      <span class="input-group-text" onclick="togglePasswordVisibility()" style="cursor: pointer;">
                        <i id="togglePasswordIcon" class="bi bi-eye"></i>
                      </span>
                    </div>
                    <div class="d-flex justify-content-end gap-4">
                      <button id="BotaoVoltar" class="btn btn-secondary" onclick="window.location.href='login.html';"
                        type="button">
                        Voltar
                      </button>
        
                      <button id="signupButton" class="btn btn-primary" type="button">
                        Salvar alterações
                      </button>
                    </div>
                  </form>
            </div>
        </div>
    </div>

    <!-- Modal container -->
    <div id="modalContainer" class="modal">
        <div class="modal-conteudo" id="conteudoModal">
        </div>
    </div>

    <!-- filtro nome container -->
    <div id="filtroNomeContainer" class="nomeContainer">
        <div class="filtroNome-conteudo" id="filtroNomeModal">
        </div>
    </div>

    <!-- filtro categoria container -->
    <div id="filtroCategoriaContainer" class="categoriaContainer">
        <div class="filtroCategoria-conteudo" id="filtroCategoriaModal">
         
        </div>
    </div>
    <script type="module" src="..\api/sono.js"></script>
    <script src="../js/telaFiltroNome.js"></script>
    <script src="../js/telaFiltroCategoria.js"></script>
    <script src="../js/telaCriarAtividade.js"></script>
    <script type="module" src="../js/gerenciarConta.js" async></script>
    <script>
        document.getElementById("userName").innerText = "Olá, " + localStorage.getItem("userName") + "!";
        document.getElementById("userNameP").innerText = "Olá, " + localStorage.getItem("userName") + "!";
    </script>


</body>

</html>
