<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NovaSenha</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link href="../styles/NovaSenha.css" rel="stylesheet" / >
    <script type="text/javascript" src="../js/login.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="../js/cadastro.js"></script>
    <script src="../js/NovaSenha.js"></script>
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
         <div id="coluna1" class="col-md-6 col-sm-12 px-0">
           <img
            id="robotdesktop"
            src="../imgs/ImagensLogin/NovaSenha.jpg"
            class="img-fluid"
            alt="..."
          />
          <img
            id="logomobile"
            src="../imgs/ImagensLogin/logomobile.jpg"
            class="img-fluid"
            alt="..."
          />
          <div id="container-mobile" class="container-fluid px-0">
             <img
              id="robotmobile"
              src="../imgs/ImagensLogin/NovaSenha.jpg"
              class="img-fluid"
              alt="..."
            />
            <h5>
              Criar nova senha
            </h5>
          </div>
        </div>

        <div id="login" class="col-md-6 col-sm-12">
          <img src="../imgs/ImagensLogin/logo.jpg" class="" alt="..." />
          <h5 id="textosdesktop">
            <br />
            Criar nova senha
          </h5>
          <h6 id="textosdesktop2">
            Sua nova senha deve ser diferente da senha antiga
          </h6>
          <br />
          <main class="form-signin">
            <form>
              <div id="formularioSenha" class="input-group mb-3">
                <span class="input-group-text" id="password-icon">
                    <i class="bi bi-lock-fill"></i>
                </span>
                <div class="form-floating flex-grow-1">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Password"
                        aria-label="Senha"
                        aria-describedby="password-icon"
                    />
                    <label for="password">Senha</label>
                </div>
                <span class="input-group-text" onclick="togglePasswordVisibility('password', 'togglePasswordIcon1')" style="cursor: pointer;">
                    <i id="togglePasswordIcon1" class="bi bi-eye"></i>
                </span>
            </div>
            <div id="formularioSenha" class="input-group mb-3">
                <span class="input-group-text" id="password-icon">
                    <i class="bi bi-lock-fill"></i>
                </span>
                <div class="form-floating flex-grow-1">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        class="form-control"
                        placeholder="Password"
                        aria-label="Senha"
                        aria-describedby="password-icon"
                    />
                    <label for="confirmPassword">Repetir nova senha</label>
                </div>
                <span class="input-group-text" onclick="togglePasswordVisibility('confirmPassword', 'togglePasswordIcon2')" style="cursor: pointer;">
                    <i id="togglePasswordIcon2" class="bi bi-eye"></i>
                </span>
            </div>
              <div class="d-flex justify-content-start">
                <button
                    id="BotaoCadastrar"
                    class="btn btn-primary"
                    onclick="cadastrar();"
                    type="button"
                >
                    Alterar
                </button>
            </div>
            </form>
          </main>
        </div>
      </div>
    </div>

    <footer id="footer">
      <br />
      <br />
      <br />
      <br />
      <br />
      ©2024 Saúde e Equilibrio - PUC MINAS.
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
