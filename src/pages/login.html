<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link href="../styles/login.css" rel="stylesheet" / >
    <script type="text/javascript" src="../js/login.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
         <div id="coluna1" class="col-md-6 col-sm-12 px-0">
          <img
            id="logomobile"
            src="../imgs/ImagensLogin/logomobile.jpg"
            class="img-fluid"
            alt="..."
          />
          <div id="container-mobile" class="container-fluid px-0">
            <h5>
              Seja bem-vindo (a)
            </h5>
          </div>
        </div>

        <div id="login" class="col-md-12 col-sm-12">
          <img src="../imgs/ImagensLogin/logo.jpg" class="" alt="..." />
          <h5 id="textosdesktop">
            <br />
            Seja bem-vindo (a)
          </h5>
          <h6 id="textosdesktop2">
            Vamos construir bons hábitos?
          </h6>
          <br />
          <main class="form-signin">
            <div id="TextoNovoUsuario" class="text-start mb-3">
              <span>Novo usuário? </span>
              <a href="cadastro.html" class="text-decoration-none">Criar uma conta</a>
            </div>
            <form>
              <div id="formularioEmail" class="input-group mb-3">
                <span class="input-group-text" id="email-icon"><i class="bi bi-envelope"></i></span>
                <div class="form-floating">
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="name@example.com"
                    aria-label="E-mail"
                    aria-describedby="email-icon"
                  />
                  <label for="email">Email</label>
                </div>
              </div>
              <div id="formularioSenha" class="input-group mb-3">
                <span class="input-group-text" id="password-icon"><i class="bi bi bi-lock"></i></span>
                <div class="form-floating">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Password"
                    aria-label="Senha"
                    aria-describedby="password-icon"
                  />
                  <label for="password">Senha</label>
                </div>
              </div>
              <div id="TextoNovoUsuario" class="text-start mb-3">
                <span>Esqueceu sua senha? </span>
                <a href="EsqueceuSenha.html" class="text-decoration-none">Clique aqui</a>
              </div>
              <button
                id="botao"
                class="btn py-2"
                onclick="login(document.getElementById('email').value, document.getElementById('password').value);"
                type="reset"
              >
                ENTRAR
              </button>
            </form>
          </main>
        </div>
      </div>
    </div>

    <footer id="footer">
      <br />
      <br />
      ©2024 Saúde e Equilibrio - PUC MINAS.
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
