<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EsqueceuSenha</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link href="../styles/EsqueceuSenha.css" rel="stylesheet" / >
    <script type="text/javascript" src="../js/login.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="../js/cadastro.js"></script>
    <script src="../js/EsqueceuSenha.js" defer></script> <!-- Referência ao script -->
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
         <div id="coluna1" class="col-md-6 col-sm-12 px-0">
           <img
            id="robotdesktop"
            src="../imgs/ImagensLogin/EsqueceuSenha.jpg"
            class="img-fluid"
            alt="..."
          />
          <img
            id="logomobile"
            src="..\imgs\iconesTemplatePadrao\logo projeto.svg"
            class="img-fluid"
            alt="..."
          />
          <div id="container-mobile" class="container-fluid px-0">
             <img
              id="robotmobile"
              src="../imgs/ImagensLogin/EsqueceuSenha.jpg"
              class="img-fluid"
              alt="..."
            />
            <h5>
              Esqueceu sua senha?
            </h5>
          </div>
        </div>
        <div id="login" class="col-md-6 col-sm-12">
          <img src="../imgs/iconesTemplatePadrao/logo projeto.svg" class="" alt="..." />
          <h5 id="textosdesktop">
            <br />
            Esqueceu sua senha?
          </h5>
          <h6 id="textosdesktop2">
            Enviaremos um link para o seu email para você alterar a sua senha
          </h6>
          <br />
          <main class="form-signin">
            <form>
              <div id="formularioEmail" class="input-group mb-3">
                  <span class="input-group-text" id="email-icon"><i class="bi bi-envelope"></i></span>
                  <div class="form-floating">
                      <input
                          type="email"
                          id="email"
                          name="email"
                          class="form-control"
                          placeholder="name@example.com"
                          aria-label="E-mail"
                          aria-describedby="email-icon"
                      />
                      <label for="email">Insira aqui seu e-mail</label>
                  </div>
              </div>
              <button
                  id="BotaoEnviar"
                  class="btn btn-primary"
                  onclick="enviar();"
                  type="button"
              >
                  Enviar
              </button>
          </form>
          <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
          <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>
          </main>
        </div>
      </div>
    </div>

    <footer id="footer">
      <br />
      <br />
      <br />
      <br />
      <br />
      ©2024 Saúde e Equilibrio - PUC MINAS.
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
