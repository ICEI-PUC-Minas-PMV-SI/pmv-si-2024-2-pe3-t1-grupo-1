<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/alimentacao.css">
    <link rel="stylesheet" href="../styles/modal.css">
    <link rel="shortcut icon" href="../imgs/index/Vector.png" type="image/x-icon">
    <title>Alimentação</title>
</head>

<body>
    <div class="header">
        <h1>Alimentação</h1>
        <div class="user-info">
            <div class="avatar-section">
                <img src="../imgs/iconesTemplatePadrao/icon_avatar.png" alt="Avatar do usuário" class="avatar">
                <p class="user-name" id="userName">Usuário XXX</p>
            </div>
            <div class="actions">
                <a class="edit-info" href="../pages/GerenciarConta.html">
                    <img src="../imgs/iconesTemplatePadrao/icon_editar.svg" alt="Ícone editar"> Editar informações
                </a>
                <a class="logout" href="../index.html">
                    <img src="../imgs/iconesTemplatePadrao/icon_sair.svg" alt="Ícone sair"> Sair
                </a>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
            <img src="../imgs/iconesTemplatePadrao/logo projeto.svg">
            <a href="..\pages\PaginaInicialLogado.html">
                <img src="../imgs/iconesTemplatePadrao/icon_paginainicial.svg">
            </a>
            <a href="..\pages\comunidades.html">
                <img src="../imgs/iconesTemplatePadrao/icon_comunidades.svg">
            </a>
            <a href="..\pages\ConteudosEducacionais.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_conteudoseducacionais.svg">
            </a>
            <a href="..\pages\alimentacao.html">
                <img src="../imgs/iconesTemplatePadrao/icon_alimentacao.svg">
            </a>
            <a href="..\pages\atividades_fisicas.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_atividadesfisicas.svg">
            </a>
            <a href="../pages/sono.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_sono.svg">
            </a>
            <a href="../pages/humor.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_humor.svg">
            </a>
            <a href="..\pages/metas.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_metas.svg">
            </a>
            <a href="..\pages\Ajuda.html">
                <img src="..\imgs\iconesTemplatePadrao/icon_ajuda.svg">
            </a>
        </div>
        <div class="container_principal">
            <p class="slogan-title">Registre os alimentos consumidos e acompanhe histórico calórico e nutricional</p>
            <div class="quadro_tabela">
                <div class="container-buttons">
                    <div class="btn_adicionar">
                        <button id="openModal">ADICIONAR</button>
                    </div>
                </div>
                <div id="fundo_colunas">
                    <div id="top_column">
                        <h3 id="nome">Refeição</h3>
                        <h3>Alimentos Consumidos</h3>
                        <h3>Calorias</h3>
                    </div>
                </div>
                <div id="data-container"></div>
            </div>
        </div>
    </div>

    <!-- Modal container -->
    <div id="modalContainer" class="modal-overlay">
        <div class="modal">
            <h1 class="modal-title">Cadastro de alimentação</h1>
            <form class="modal-form">
                <label class="modal-label">Refeição
                    <select id="refeicao" class="modal-input">
                        <option value=""></option>
                        <option value="Café da manhã">Café da manhã</option>
                        <option value="Almoço">Almoço</option>
                        <option value="Lanche da tarde">Lanche da tarde</option>
                        <option value="Jantar">Jantar</option>
                    </select>
                </label>

                <label class="modal-label">Alimentos
                    <textarea id="alimentos" class="modal-input" rows="5"></textarea>
                </label>

                <label class="modal-label">Calorias
                    <input  class="modal-input" type="number" id="calorias" required>
                </label>
            </form>

            <div class="container-modal-buttons">
                <button id="closeModal" class="modal-button">Cancelar</button>
                <button id="submitModal" class="modal-button">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modalContainerEditar" class="modal-overlay">
        <div class="modal">
            <h1 class="modal-title">Cadastro de alimentação</h1>
            <form class="modal-form">
                <label class="modal-label">Refeição
                    <select id="refeicaoEdit" class="modal-input">
                        <option value=""></option>
                        <option value="Café da manhã">Café da manhã</option>
                        <option value="Almoço">Almoço</option>
                        <option value="Lanche da tarde">Lanche da tarde</option>
                        <option value="Jantar">Jantar</option>
                    </select>
                </label>

                <label class="modal-label">Alimentos
                    <textarea id="alimentosEdit" class="modal-input" rows="5"></textarea>
                </label>

                <label class="modal-label">Calorias
                    <input  class="modal-input" type="number" id="caloriasEdit" required>
                </label>
            </form>

            <div class="container-modal-buttons">
                <button id="closeModalEditar" class="modal-button">Cancelar</button>
                <button id="submitModalEditar" class="modal-button">Salvar</button>
            </div>
        </div>
    </div>

    <script type="module" src="..\api/alimentacao.js"></script>

    <script>
        document.getElementById("userName").innerText = "Olá, " + localStorage.getItem("userName") + "!";
        document.getElementById("userNameP").innerText = "Olá, " + localStorage.getItem("userName") + "!";
    </script>
</body>

</html>
