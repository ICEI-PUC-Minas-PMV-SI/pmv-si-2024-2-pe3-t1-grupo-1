<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VerificarEmail</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link href="../styles/VerificarEmail.css" rel="stylesheet" / >
    <script type="text/javascript" src="../js/login.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="../js/VerificarEmail.js" defer></script>
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
         <div id="coluna1" class="col-md-6 col-sm-12 px-0">
          <img
            id="logomobile"
            src="../imgs/ImagensLogin/logomobile.jpg"
            class="img-fluid"
            alt="..."
          />
          <div id="container-mobile" class="container-fluid px-0">
            <h5>
              Verifique o seu e-mail
            </h5>
          </div>
        </div>
        <div id="login" class="col-md-12 col-sm-12" style="display: none;"> <!-- Inicialmente oculta -->
          <img src="../imgs/ImagensLogin/logo.jpg" class="img-fluid" alt="Logo" />
          <h5 id="textosdesktop">
            <br />
            Verifique o seu e-mail
          </h5>
          <h6 id="textosdesktop2">
            Encaminhamos o link para <span id="emailFeedback"></span> para que a senha seja alterada.
          </h6>
          <br />
          <main class="form-signin">
            <div id="TextoNovoUsuario" class="text-center mb-3">
              <span>Não recebeu o e-mail?</span>
              <a href="#" class="text-decoration-none" onclick="reenviarEmail();">Clique para reenviar</a>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>

    <footer id="footer">
      <br />

    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
