<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link href="../styles/cadastro.css" rel="stylesheet" / >
    <script type="text/javascript" src="../js/login.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="../js/cadastro.js"></script>
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
         <div id="coluna1" class="col-md-6 col-sm-12 px-0">
           <img
            id="robotdesktop"
            src="../imgs/ImagensLogin/FotoCadastro.jpg"
            class="img-fluid"
            alt="..."
          />
          <img
            id="logomobile"
            src="../imgs/iconesTemplatePadrao/logo projeto.svg"
            class="img-fluid"
            alt="..."
          />
          <div id="container-mobile" class="container-fluid px-0">
             <img
              id="robotmobile"
              src="../imgs/ImagensLogin/FotoCadastro.jpg"
              class="img-fluid"
              alt="..."
            />
            <h5>
              Seja bem-vindo (a)
            </h5>
          </div>
        </div>

        <div id="login" class="col-md-6 col-sm-12">
          <img src="../imgs/iconesTemplatePadrao/logo projeto.svg" class="" alt="..." />
          <h5 id="textosdesktop">
            <br />
            Criar uma conta
          </h5>
          <h6 id="textosdesktop2">
            Preencha os dados solicitados para criar sua nova conta
          </h6>
          <br />
          <main class="form-signin">
            <form>
              <div id="formularioNome" class="input-group mb-3">
                <span class="input-group-text" id="nome-icon"><i class="bi bi-person-fill"></i></span>
                <div class="form-floating">
                  <input
                    type="text"
                    id="nome"
                    name="nome"
                    class="form-control"
                    placeholder="Nome Completo"
                    aria-label="Nome Completo"
                    aria-describedby="nome-icon"
                  />
                  <label for="nome">Nome Completo</label>
                </div>
              </div>
              <div id="formularioIdade" class="input-group mb-3">
                <span class="input-group-text" id="idade-icon"><i class="bi bi-people-fill"></i></span>
                <div class="form-floating">
                  <input
                    type="number"
                    id="idade"
                    name="idade"
                    class="form-control"
                    placeholder="Idade"
                    aria-label="Idade"
                    aria-describedby="idade-icon"
                    min="0"
                    max="120"
                  />
                  <label for="idade">Idade</label>
                </div>
              </div>
              <div id="formularioTelefone" class="input-group mb-3">
                <span class="input-group-text" id="telefone-icon"><i class="bi bi-telephone-fill"></i></span>
                <div class="form-floating">
                  <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    class="form-control"
                    placeholder="(00) 00000-0000"
                    aria-label="Telefone"
                    aria-describedby="telefone-icon"
                    pattern="\(\d{2}\) \d{5}-\d{4}"
                  />
                  <label for="telefone">Telefone</label>
                </div>
              </div>
              <div id="formularioEmail" class="input-group mb-3">
                <span class="input-group-text" id="email-icon"><i class="bi bi-envelope-fill"></i></span>
                <div class="form-floating">
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="name@example.com"
                    aria-label="E-mail"
                    aria-describedby="email-icon"
                  />
                  <label for="email">Email</label>
                </div>
              </div>
              <div id="formularioSenha" class="input-group mb-3">
                <span class="input-group-text" id="password-icon">
                  <i class="bi bi-lock-fill"></i>
                </span>
                <div class="form-floating flex-grow-1">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Password"
                    aria-label="Senha"
                    aria-describedby="password-icon"
                  />
                  <label for="password">Senha</label>
                </div>
                <span class="input-group-text" onclick="togglePasswordVisibility()" style="cursor: pointer;">
                  <i id="togglePasswordIcon" class="bi bi-eye"></i>
                </span>
              </div>
              <div class="d-flex justify-content-end gap-5">
                <button
                    id="BotaoVoltar"
                    class="btn btn-secondary"
                    onclick="window.location.href='login.html';"
                    type="button"
                >
                    Voltar
                </button>
              
                <button
                    id="BotaoCadastrar"
                    class="btn btn-primary"
                    onclick="cadastrar();"
                    type="button"
                >
                    Cadastrar
                </button>
            </div>
            </form>
          </main>
        </div>
      </div>
    </div>

    <footer id="footer">
      <br />
      <br />
      <br />
      <br />
      <br />
      ©2024 Saúde e Equilibrio - PUC MINAS.
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
