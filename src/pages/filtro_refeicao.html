<!DOCTYPE html>
<html lang = "pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="..\styles\global.css">
        <link rel="stylesheet" href="..\styles/filtro_refeicao.css">
        <title>Refeição</title>
</head>
<body>
    <div class="principal">
        <h1>Refeição</h1>
        <button class="btn_selecao">Limpar seleção</button>
    </div>
    <div class="container_pai">
        <div class="opcoes_checkbox">
            <span>Café da Manhã</span><input type="checkbox" name="opcoes" value="Bicicleta"/><br />
            <span>Lanche da Manhã</span><input type="checkbox" name="opcoes" value="Corrida"/><br />
            <span>Almoço</span><input type="checkbox" name="opcoes" value="Musculação"/><br />
            <span>Lanche da Tarde</span><input type="checkbox" name="opcoes" value="Natação"/><br />
            <span>Jantar</span><input type="checkbox" name="opcoes" value="Yoga"/><br />
            <span>Lanche da Noite</span><input type="checkbox" name="opcoes" value="Outro"/><br />
         </div>
    </div>
    <div class="button_pai">
        <button class="btn_voltar" id="voltarID">VOLTAR</button>
        <button class="btn_filtrar" id="filtrarID">FILTRAR</button>
    </div>
    <script src="../js/telaFiltroCategoria.js"></script>
</body>
</html>
