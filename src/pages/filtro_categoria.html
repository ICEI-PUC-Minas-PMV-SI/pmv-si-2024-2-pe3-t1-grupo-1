<!DOCTYPE html>
<html lang = "pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="..\styles\global.css">
        <link rel="stylesheet" href="..\styles\filtro_categoria.css">
        <link rel="stylesheet" href="..\styles\filtroCategoria.css">
        <title>Categoria</title>
</head>
<body>
    <div class="principal">
        <h1>Categoria</h1>
        <button class="btn_selecao">Limpar seleção</button>
    </div>
    <div class="container_pai">
        <div class="opcoes_checkbox">
            <span>Bicicleta</span><input type="checkbox" name="opcoes" value="Bicicleta"/><br />
            <span>Corrida</span><input type="checkbox" name="opcoes" value="Corrida"/><br />
            <span>Musculação</span><input type="checkbox" name="opcoes" value="Musculação"/><br />
            <span>Natação</span><input type="checkbox" name="opcoes" value="Natação"/><br />
            <span>Yoga</span><input type="checkbox" name="opcoes" value="Yoga"/><br />
            <span>Outro</span><input type="checkbox" name="opcoes" value="Outro"/><br />
         </div>
    </div>
    <div class="button_pai">
        <button class="btn_voltar" id="voltarID">VOLTAR</button>
        <button class="btn_filtrar" id="filtrarID">FILTRAR</button>
    </div>
    <script src="../js/telaFiltroCategoria.js"></script>
</body>
</html>
