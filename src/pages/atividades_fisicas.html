<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/atividades_fisicas.css">
    <link rel="stylesheet" href="../styles/modal.css">
    <link rel="shortcut icon" href="../imgs/index/Vector.png" type="image/x-icon">
    <title>Atividades Físicas</title>
</head>

<body>
    <div class="header">
        <h1>Atividades Físicas</h1>
        <div class="user-info">
            <div class="avatar-section">
                <img src="../imgs/iconesTemplatePadrao/icon_avatar.png" alt="Avatar do usuário" class="avatar">
                <p class="user-name" id="userName"></p>
            </div>
            <div class="actions">
                <a class="edit-info" href="../pages/GerenciarConta.html">
                    <img src="../imgs/iconesTemplatePadrao/icon_editar.svg" alt="Ícone editar"> Editar informações
                </a>
                <a class="logout" href="../index.html">
                    <img src="../imgs/iconesTemplatePadrao/icon_sair.svg" alt="Ícone sair"> Sair
                </a>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
            <img src="../imgs/iconesTemplatePadrao/logo projeto.svg">
            <a href="..\pages\PaginaInicialLogado.html">
                <img src="../imgs/iconesTemplatePadrao/icon_paginainicial.svg">
            </a>
            <a href="..\pages\comunidades.html">
                <img src="../imgs/iconesTemplatePadrao/icon_comunidades.svg">
            </a>
            <a href="..\pages\ConteudosEducacionais.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_conteudoseducacionais.svg">
            </a>
            <a href="..\pages\alimentacao.html">
                <img src="../imgs/iconesTemplatePadrao/icon_alimentacao.svg">
            </a>
            <a href="..\pages\atividades_fisicas.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_atividadesfisicas.svg">
            </a>
            <a href="../pages/sono.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_sono.svg">
            </a>
            <a href="../pages/humor.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_humor.svg">
            </a>
            <a href="..\pages/metas.html">
                <img src="..\imgs\iconesTemplatePadrao\icon_metas.svg">
            </a>
            <a href="..\pages\Ajuda.html">
                <img src="..\imgs\iconesTemplatePadrao/icon_ajuda.svg">
            </a>
        </div>
        <div class="container_principal">
            <p class="slogan-title">Registre e acompanhe suas atividades físicas</p>
            <div class="quadro_tabela">
                <div class="btn_adicionar">
                    <button id="openModalAtividade">ADICIONAR</button>
                </div>
                <div id="fundo_colunas">
                    <div id="top_column">
                        <h3 id="nome">Nome</h3>
                        <h3>Duração (Minutos)</h3>
                        <h3>Intensidade</h3>
                    </div>
                </div>
                <div id="data-container"></div>
            </div>
        </div>
    </div>

    <!-- Modal container -->
    <div id="modalContainerAtividade" class="modal-overlay">
        <div class="modal">
            <h1 class="modal-title">Cadastro de Atividade</h1>
            <form class="modal-form">
                <label class="modal-label">Nome
                    <input class="modal-input" type="text" id="nomeAtividade" required>
                </label>

                <label class="modal-label">Duração (Minutos)
                    <input class="modal-input" type="text" id="duracao" required>
                </label>

                <label class="modal-label">Intensidade
                    <select id="intensidade" class="modal-input">
                        <option value=""></option>
                        <option value="Alta">Alta</option>
                        <option value="Média">Média</option>
                        <option value="Baixa">Baixa</option>
                    </select>
                </label>
            </form>

            <div class="container-modal-buttons">
                <button id="closeModalAtividade" class="modal-button">Cancelar</button>
                <button id="submitModalAtividade" class="modal-button">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modalContainerEditarAtividade" class="modal-overlay">
        <div class="modal">
            <h1 class="modal-title">Atualização de atividade</h1>
            <form class="modal-form">
                <label class="modal-label">Nome
                    <input class="modal-input" type="text" id="nomeEdit" required>
                </label>

                <label class="modal-label">Duração (Minutos)
                    <input class="modal-input" type="text" id="duracaoEdit" required>
                </label>

                <label class="modal-label">Intensidade
                    <select id="intensidadeEdit" class="modal-input">
                        <option value=""></option>
                        <option value="Alta">Alta</option>
                        <option value="Média">Média</option>
                        <option value="Baixa">Baixa</option>
                    </select>
                </label>
            </form>

            <div class="container-modal-buttons">
                <button id="closeModalEditarAtividade" class="modal-button">Cancelar</button>
                <button id="submitModalEditarAtividade" class="modal-button">Salvar</button>
            </div>
        </div>
    </div>


    <script type="module" src="../api/atvdFisica.js"></script>

    <script>
        document.getElementById("userName").innerText = "Olá, " + localStorage.getItem("userName") + "!";
        document.getElementById("userNameP").innerText = "Olá, " + localStorage.getItem("userName") + "!";
    </script>
</body>

</html>
